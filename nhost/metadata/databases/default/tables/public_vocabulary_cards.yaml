table:
  name: vocabulary_cards
  schema: public
object_relationships:
  - name: vocabulary_set
    using:
      foreign_key_constraint_on: set_id
select_permissions:
  - role: user
    permission:
      columns: [id, set_id, term, translation, status, position, correct_answers, incorrect_answers, last_reviewed_at, created_at, updated_at]
      filter:
        vocabulary_set:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        vocabulary_set:
          user_id:
            _eq: X-Hasura-User-Id
      columns: [id, set_id, term, translation, status, position, correct_answers, incorrect_answers, last_reviewed_at, created_at, updated_at]
update_permissions:
  - role: user
    permission:
      columns: [term, translation, status, position, correct_answers, incorrect_answers, last_reviewed_at, updated_at]
      filter:
        vocabulary_set:
          user_id:
            _eq: X-Hasura-User-Id
      check:
        vocabulary_set:
          user_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        vocabulary_set:
          user_id:
            _eq: X-Hasura-User-Id
