table:
  name: vocabulary_sets
  schema: public
array_relationships:
  - name: vocabulary_cards
    using:
      foreign_key_constraint_on:
        column: set_id
        table:
          name: vocabulary_cards
          schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, title, description, created_at, updated_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns: [id, user_id, title, description, created_at, updated_at]
      set:
        user_id: x-hasura-user-id
update_permissions:
  - role: user
    permission:
      columns: [title, description, updated_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
